name: update-locks

on:
  schedule:
    - cron: "0 0 * * 6" # 毎週土曜 09:00 JST
  workflow_dispatch:

# 既定をゼロ権限にする。書き込みはすべて App トークンで行う
permissions: {}

jobs:
  update:
    # なぜ App トークンなのかは adr/agent-rules-nix/0001
    runs-on: ubuntu-latest
    steps:
      # App トークンで PR を作ると ci.yaml が起動する。
      # GITHUB_TOKEN 製の PR では CI が発火せず、auto-merge が必須チェック待ちで止まる
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      - run: nix flake update

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: pr
        with:
          token: ${{ steps.token.outputs.token }}
          title: "chore: flake.lock を更新"
          commit-message: "chore: flake.lock を更新"
          branch: update-locks
          delete-branch: true

      # ブランチ保護を迂回しない。ci.yaml の nix flake check が通って初めてマージされる
      - if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR: ${{ steps.pr.outputs.pull-request-number }}
        run: gh pr merge --squash --delete-branch --auto "$PR"
